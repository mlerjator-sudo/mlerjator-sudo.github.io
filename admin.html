<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F34 Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', 'Noto Sans KR', sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.06);
        }

        .tab-btn {
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: #3b82f6;
            border-color: #3b82f6;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>

<body class="min-h-screen">
    <!-- Login Screen -->
    <div id="login-screen" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-6">
        <div class="glass p-12 max-w-md w-full text-center border-white/5">
            <img src="logo.png" alt="Logo" class="h-20 mx-auto mb-8 rounded-2xl shadow-xl">
            <h1 class="text-3xl font-black mb-2 tracking-tighter uppercase italic">Admin Access</h1>
            <p class="text-slate-500 mb-8 text-sm lowercase">Please login with an authorized administrator nickname.</p>
            
            <div id="login-form" class="space-y-4">
                <input type="text" id="login-nickname" placeholder="Nickname" 
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500 transition-all text-white font-bold">
                <input type="password" id="login-password" placeholder="Password" 
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500 transition-all text-white font-bold">
                <button id="do-login-btn"
                    class="w-full py-4 rounded-2xl bg-blue-600 text-white font-black text-lg hover:bg-blue-500 transition-all shadow-lg shadow-blue-600/20 uppercase italic">
                    Login
                </button>
            </div>
            <p id="login-error" class="text-red-500 text-xs mt-6 font-bold hidden bg-red-500/10 py-3 rounded-xl border border-red-500/20 uppercase tracking-tighter"></p>
        </div>
    </div>

    <!-- Main Admin Panel -->
    <div id="admin-panel" class="hidden">
        <!-- Sidebar/Header -->
        <header class="glass sticky top-0 z-40 mx-6 mt-6 p-4 flex justify-between items-center border-white/10">
            <div class="flex items-center gap-8">
                <div class="flex items-center gap-3">
                    <img src="logo.png" alt="Logo" class="h-10 rounded-lg">
                    <span class="font-black tracking-tighter text-xl">ADMIN</span>
                </div>
                <nav class="flex gap-2">
                    <button onclick="switchTab('configs')" id="tab-configs"
                        class="tab-btn active px-6 py-2 font-bold text-sm">Approvals</button>
                    <button onclick="switchTab('approved_configs')" id="tab-approved_configs"
                        class="tab-btn px-6 py-2 font-bold text-sm">Approved</button>
                    <button onclick="switchTab('players')" id="tab-players"
                        class="tab-btn px-6 py-2 font-bold text-sm">Players</button>
                    <button onclick="switchTab('support')" id="tab-support"
                        class="tab-btn px-6 py-2 font-bold text-sm">Tickets</button>
                    <button onclick="switchTab('reports')" id="tab-reports"
                        class="tab-btn px-6 py-2 font-bold text-sm text-red-400">Reports</button>
                </nav>
            </div>
            <div class="flex items-center gap-4">
                <div class="glass p-1 flex gap-1 text-[10px] font-bold uppercase">
                    <button onclick="setLang('en')" id="lang-en" class="px-3 py-1.5 rounded-lg">EN</button>
                    <button onclick="setLang('ko')" id="lang-ko" class="px-3 py-1.5 rounded-lg">KO</button>
                </div>
                <button id="auth-btn" class="glass px-6 py-2 font-bold text-xs hover:bg-white/10 transition-all">
                    Logout
                </button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto p-6">
            <!-- Section: Config Approvals -->
            <div id="section-configs" class="space-y-6">
                <div class="flex justify-between items-end mb-8">
                    <h2 class="text-2xl font-bold" id="t-pending-title">Pending Approvals</h2>
                </div>
                <div id="config-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Configs will be injected here -->
                </div>
            </div>

            <!-- Section: Approved Configs -->
            <div id="section-approved_configs" class="hidden space-y-6">
                <div class="flex justify-between items-end mb-8">
                    <h2 class="text-2xl font-bold" id="t-approved-title">Approved Instances</h2>
                </div>
                <div id="approved-config-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Approved Configs will be injected here -->
                </div>
            </div>

            <!-- Section: Player Management -->
            <div id="section-players" class="hidden space-y-6">
                <div class="flex justify-between items-end mb-8">
                    <h2 class="text-2xl font-bold" id="t-players-title">Player Management</h2>
                </div>
                <div class="glass overflow-hidden">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="bg-white/5 text-[10px] font-bold uppercase tracking-widest text-slate-500">
                                <th class="px-6 py-4">Player</th>
                                <th class="px-6 py-4">Email</th>
                                <th class="px-6 py-4">Grade</th>
                                <th class="px-6 py-4">Warnings</th>
                                <th class="px-6 py-4">Status</th>
                                <th class="px-6 py-4 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="player-list">
                            <!-- Players will be injected here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Section: Support Center -->
            <div id="section-support" class="hidden space-y-6">
                <div class="flex justify-between items-end mb-8">
                    <h2 class="text-2xl font-bold" id="t-support-title">Support Tickets</h2>
                </div>
                <div id="support-list" class="grid grid-cols-1 gap-6">
                    <!-- Tickets will be injected here -->
                </div>
            </div>

            <!-- Section: Reports -->
            <div id="section-reports" class="hidden space-y-6">
                <div class="flex justify-between items-end mb-8">
                    <h2 class="text-2xl font-bold" id="t-reports-title">Reports</h2>
                </div>
                <div id="reports-list" class="grid grid-cols-1 gap-6">
                    <!-- Reports will be injected here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Player Details Modal -->

        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closePlayerModal()"></div>

            <div id="player-modal-content">

        </div>

                },
                categories: { General: "일반" }
            }
        };

        let currentLang = localStorage.getItem('f34_lang') || 'en';
        let db, auth, provider;
        let currentUser = null;
        let mcAccount = null;
        let allConfigs = [];
        let allPlayers = [];

        let allReports = [];
        let dataLoaded = false;
        let currentTab = 'configs';
        let fetchTimeout = null;

        function log(msg) { console.log(`[F34 Admin] ${msg}`); }

        window.setLang = (lang) => {
            currentLang = lang;
            localStorage.setItem('f34_lang', lang);
            updateUI();
        };

        window.switchTab = (tab) => {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const tabBtn = document.getElementById(`tab-${tab}`);
            if (tabBtn) tabBtn.classList.add('active');

            ['configs', 'approved_configs', 'players', 'support', 'reports'].forEach(t => {
                const sec = document.getElementById(`section-${t}`);
                if (sec) sec.classList.add('hidden');
            });
            const activeSec = document.getElementById(`section-${tab}`);
            if (activeSec) activeSec.classList.remove('hidden');

            if (tab === 'configs') fetchConfigs();
            if (tab === 'approved_configs') fetchApprovedConfigs();
            if (tab === 'players') fetchPlayers();
            if (tab === 'support') fetchTickets();
            if (tab === 'reports') fetchReports();
        };

            const t = i18n[currentLang] || i18n.en;
            const pt = document.getElementById('t-pending-title');
            const at = document.getElementById('t-approved-title');
            const plt = document.getElementById('t-players-title');
            const st = document.getElementById('t-support-title');
            const rt = document.getElementById('t-reports-title');

            if (pt) pt.textContent = t.pendingTitle;
            if (at) at.textContent = t.approvedTitle;
            if (plt) plt.textContent = t.playersTitle;
            if (st) st.textContent = t.supportTitle;
            if (rt) rt.textContent = t.reportsTitle;

            // Flags for Language Badges
            const langFlags = {
                en: 'https://flagcdn.com/w20/us.png',
                jp: 'https://flagcdn.com/w20/jp.png',
                cn: 'https://flagcdn.com/w20/cn.png',
                ko: 'https://flagcdn.com/w20/kr.png',
                tw: 'https://flagcdn.com/w20/tw.png',
                fr: 'https://flagcdn.com/w20/fr.png',
                de: 'https://flagcdn.com/w20/de.png',
                es: 'https://flagcdn.com/w20/es.png',
                ru: 'https://flagcdn.com/w20/ru.png',
                vn: 'https://flagcdn.com/w20/vn.png',
                th: 'https://flagcdn.com/w20/th.png'
            };
            window.langFlags = langFlags;

            // Update main navigation to Korean
            const navItems = {
                'Approvals': '승인 대기', 
                'Approved': '인스턴스 목록',
                'Players': '플레이어 관리',
                'Tickets': '고객 문의',
                'Reports': '신고 기록'
            };
            document.querySelectorAll('nav button').forEach(btn => {
                const text = btn.textContent.trim();
                const id = btn.id.replace('tab-', '');
                if (navItems[text]) btn.textContent = navItems[text];
                // Fallback by ID if text was already translated
                if (id === 'approved_configs') btn.textContent = navItems['Approved'];
                if (id === 'configs') btn.textContent = navItems['Approvals'];
            });

            document.querySelectorAll('[id^="lang-"]').forEach(btn => {
                btn.classList.remove('bg-white/10', 'text-blue-400');
                if (btn.id === `lang-${currentLang}`) btn.classList.add('bg-white/10', 'text-blue-400');
            });
            renderConfigs();
            renderApprovedConfigs();
            renderPlayers();
            renderTickets();
            renderReports();
        }

        let approvedConfigs = [];

        async function fetchConfigs() {
            try {
                const q = query(collection(db, "shared_configs"), where("status", "==", "pending"));
                const snap = await getDocs(q);
                allConfigs = [];
                snap.forEach(doc => allConfigs.push({ id: doc.id, ...doc.data() }));
                dataLoaded = true;
                renderConfigs();
            } catch (e) {
                log("Fetch Configs Error: " + e.message);
                fetchConfigsREST();
            }
        }

        async function fetchApprovedConfigs() {
            const container = document.getElementById('approved-config-list');
            if (!container) return;
            container.innerHTML = '<div class="col-span-full py-10 text-center opacity-50">Loading approved configs...</div>';
            
            try {
                const q = query(collection(db, "shared_configs"), where("status", "==", "approved"));
                const snap = await getDocs(q);
                approvedConfigs = [];
                snap.forEach(doc => approvedConfigs.push({ id: doc.id, ...doc.data() }));
                
                // Manual sort if index is missing
                approvedConfigs.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));

                renderApprovedConfigs();
            } catch (e) {
                log("Fetch Approved Configs Error: " + e.message);
                container.innerHTML = `<div class="col-span-full py-10 text-center text-red-400">Error: ${e.message}</div>`;
            }
        }

        function renderApprovedConfigs() {
            const t = i18n[currentLang] || i18n.en;
            const list = document.getElementById('approved-config-list');
            if (!list) return;
            if (approvedConfigs.length === 0) {
                list.innerHTML = `<div class="col-span-full glass p-12 text-center text-xl">${t.noConfigs || 'No approved configurations.'}</div>`;
                return;
            }
            list.innerHTML = '';
            approvedConfigs.forEach(data => {
                const div = document.createElement('div');
                div.className = "glass p-6 card-hover flex flex-col justify-between group border-blue-500/20";
                
                const flagUrl = langFlags[data.language] || null;
                const langBadge = flagUrl ? `<img src="${flagUrl}" class="inline-block w-4 h-3 mr-1 rounded-[1px]">` : '';

                div.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-xl font-bold text-white mb-1">${data.name || 'Untitled'}</h3>
                                <div class="flex items-center gap-2">
                                    <span class="text-[10px] text-blue-400 font-bold uppercase tracking-widest">${normalizeCategoryAlias(data.category)}</span>
                                    ${langBadge}
                                    ${data.is_f34 ? '<span class="px-2 py-0.5 rounded text-[10px] bg-sky-500/20 text-sky-400 font-bold">F34</span>' : ''}
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="downloadConfig('${data.id}')" class="p-2 text-slate-400 hover:text-white transition-colors">
                                    <i class="fas fa-download"></i>
                                </button>
                                <button onclick="deleteApprovedConfig('${data.id}')" class="p-2 text-red-400 hover:bg-red-400/10 rounded-lg transition-colors">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>
                        <div class="flex items-center gap-3 mb-4">
                            <img src="https://render.crafty.gg/3d/bust/${data.user_mc_name || data.author}" class="w-8 h-8 rounded-lg bg-black/20" onerror="this.src='https://minotar.net/bust/steve/100'">
                            <div class="text-xs font-bold text-slate-400">${data.author}</div>
                        </div>
                        <p class="text-slate-500 text-sm line-clamp-2 italic">"${data.description || 'No description'}"</p>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        window.deleteApprovedConfig = async (id) => {
            if (!confirm("Are you sure you want to delete this approved instance?")) return;
            try {
                await deleteDoc(doc(db, "shared_configs", id));
                alert("Deleted successfully.");
                fetchApprovedConfigs();
            } catch (e) {
                log("Delete Error: " + e.message);
                alert("Failed to delete: " + e.message);

        function renderConfigs() {
            if (!dataLoaded) return;
            const t = i18n[currentLang] || i18n.en;
            const configList = document.getElementById('config-list');
            if (!configList) return;
            if (allConfigs.length === 0) {
                configList.innerHTML = `<div class="col-span-full glass p-12 text-center text-xl">${t.noConfigs}</div>`;
                return;
            }
            configList.innerHTML = '';
            allConfigs.forEach(data => {
                const div = document.createElement('div');
                div.className = "glass p-6 card-hover flex flex-col justify-between group cursor-pointer";
                div.onclick = (e) => { 
                    if (e.target.closest('button')) return;
                    openConfigDetails(data.id);

                const catImg = CATEGORY_IMAGES[data.category] || CATEGORY_IMAGES.General;
                const flagUrl = window.langFlags ? window.langFlags[data.language] : null;
                const langBadge = flagUrl ? `<img src="${flagUrl}" class="inline-block w-4 h-3 mr-1 rounded-[1px]">` : '';

                div.innerHTML = `
                    <div>
                        <div class="relative h-32 -mx-6 -mt-6 mb-6 overflow-hidden rounded-t-3xl border-b border-white/5">

                            <div class="absolute bottom-3 left-6">
                                <div class="text-[9px] text-blue-400 font-bold uppercase tracking-widest flex items-center gap-1">
                                    ${langBadge} ${data.category}
                                </div>
                                <h3 class="font-black text-lg tracking-tight italic uppercase truncate max-w-[200px]" title="${data.name || 'Untitled'}">${data.name || 'Untitled'}</h3>
                            </div>
                        </div>
                        
                        <div class="flex justify-between items-center mb-4">
                            <div class="flex gap-1">
                                <span class="text-[9px] bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded font-bold">${data.mc_version || '--'}</span>
                                <span class="text-[9px] bg-white/5 text-slate-500 px-2 py-0.5 rounded font-bold">Language: ${data.language || 'en'}</span>
                            </div>
                            <div class="text-[10px] text-slate-500 font-bold">by ${data.author.split('@')[0]}</div>
                        </div>

                        <p class="text-xs text-slate-400 line-clamp-2 mb-6 h-8 italic">"${data.description || 'No description'}"</p>
                    </div>

                                author: fields.author?.stringValue,

                                description: fields.description?.stringValue,

                                data: fields.config_json?.stringValue || fields.data?.stringValue
                            };
                        })

                    renderConfigs();

        async function fetchPlayers() {
            try {
                // Get all users from Auth collection
                const snap = await getDocs(collection(db, "users"));
                allPlayers = [];
                snap.forEach(doc => allPlayers.push({ email: doc.id, ...doc.data() }));

                // Add current admin if they are not in the list (already linked accounts show up normally)
                if (currentUser && !allPlayers.find(p => p.email.toLowerCase() === currentUser.email.toLowerCase())) {
                    allPlayers.push({
                        email: currentUser.email,
                        mc_name: currentUser.email.split('@')[0],
                        grade: 'Admin',
                        warnings: 0
                    });
                }
                
                // Fetch shared_configs to find authors who are not in the users collection yet
                const configSnap = await getDocs(collection(db, "shared_configs"));
                configSnap.forEach(doc => {
                    const data = doc.data();
                    if (data.author && !allPlayers.find(p => p.email.toLowerCase() === data.author.toLowerCase())) {
                        allPlayers.push({
                            email: data.author,
                            mc_name: data.author.split('@')[0] || 'Unknown',
                            grade: 'General',
                            warnings: 0
                        });
                    }
                });

                renderPlayers();
            } catch (e) { log("Fetch Players Error: " + e.message); }
        }

            const modal = document.getElementById('player-modal');

            document.body.style.overflow = 'auto'; 
        };

        window.banPlayer = async (nicknameOrEmail) => { 
            const hours = parseInt(document.getElementById('ban-hours').value); 
            if (isNaN(hours) || hours <= 0) return alert("Enter valid hours."); 
            try { 
                const banUntil = Date.now() + (hours * 60 * 60 * 1000); 
                const email = nicknameOrEmail.includes('@') ? nicknameOrEmail : `${nicknameOrEmail}@f34-di.com`;
                
                const userRef = doc(db, "users", email);
                const userSnap = await getDoc(userRef);
                
                if (!userSnap.exists()) {
                    // 문서가 없으면 생성 (차단 정보 포함)
                    await setDoc(userRef, { 
                        email: email,
                        mc_name: nicknameOrEmail.split('@')[0],
                        ban_until: banUntil,
                        warnings: 0,
                        grade: 'User'
                    });
                } else {
                    await updateDoc(userRef, { ban_until: banUntil }); 
                }
                
                alert("Player banned."); 
                fetchPlayers(); 
                showPlayerDetails(nicknameOrEmail); 
            } catch (e) { 
                console.error("Ban Error:", e);
                alert("Failed to ban player: " + e.message); 
            } 
        };

            try { 
                await updateDoc(doc(db, "users", email), { ban_until: null }); 
                alert("Player unbanned."); 
                fetchPlayers(); 
                showPlayerDetails(email); 
            } catch (e) { 
                console.error("Unban Error:", e);
                alert("Failed to unban player: " + e.message); 
            } 
        };

                const playerRef = doc(db, "users", email); 
                const snap = await getDoc(playerRef); 
                const warnings = (snap.data().warnings || 0) + 1; 
                await updateDoc(playerRef, { warnings: warnings }); 
                alert(`Warning issued. Total: ${warnings}`); 
                fetchPlayers(); 
                showPlayerDetails(email);

                console.error("Warn Error:", e);

                await deleteDoc(doc(db, "shared_configs", id)); 
                alert("Deleted."); 
                showPlayerDetails(email); 
            } catch (e) { 
                console.error("Delete Config Error:", e);
                alert("Failed: " + e.message); 
            } 
        };

        window.renderConfigs = () => {
            const container = document.getElementById('config-list');
            if(!container) return;
            container.innerHTML = '';
            
            allConfigs.forEach(config => {
                const langBadge = config.language && langFlags[config.language] 
                    ? `<img src="${langFlags[config.language]}" class="w-4 h-3 rounded-sm object-cover" title="${config.language}">` 
                    : '';

                const div = document.createElement('div');
                div.className = "p-4 glass rounded-xl border border-white/10 flex flex-col gap-3";
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="px-2 py-0.5 rounded text-[10px] bg-blue-500/20 text-blue-400 font-bold uppercase tracking-wider">${normalizeCategoryAlias(config.category)}</span>
                                ${langBadge}
                                ${config.is_f34 ? '<span class="px-2 py-0.5 rounded text-[10px] bg-sky-500/20 text-sky-400 font-bold">F34</span>' : ''}
                            </div>
                            <h3 class="font-bold truncate text-white/90">${config.name}</h3>
                            <div class="text-[10px] opacity-40 mt-1">${new Date(config.created_at).toLocaleString()}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <img src="https://render.crafty.gg/3d/bust/${config.user_mc_name}" class="w-8 h-8 rounded-lg bg-black/20">
                        <div class="text-xs font-bold text-white/70">${config.user_mc_name}</div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="updateStatus('${config.id}', 'approved')" class="flex-1 py-1.5 bg-emerald-600/20 text-emerald-400 rounded-lg text-xs font-bold hover:bg-emerald-600/30 transition-colors">Approve</button>
                        <button onclick="updateStatus('${config.id}', 'rejected')" class="flex-1 py-1.5 bg-red-600/20 text-red-400 rounded-lg text-xs font-bold hover:bg-red-600/30 transition-colors">Reject</button>
                    </div>
                `;
                container.appendChild(div);
            });
        };

        async function fetchTickets() {
            try {
                const q = query(collection(db, "support_tickets"), orderBy("timestamp", "desc"));
                const snap = await getDocs(q);
                allTickets = [];
                snap.forEach(doc => allTickets.push({ id: doc.id, ...doc.data() }));
                renderTickets();
            } catch (e) { 
                console.error("Fetch Tickets Error:", e);
                allTickets = [];
                renderTickets();
            }
        }

        function renderTickets() {
            const t = i18n[currentLang] || i18n.en;
            const supportList = document.getElementById('support-list');
            if (!supportList) return;
            if (allTickets.length === 0) { supportList.innerHTML = `<div class="glass p-12 text-center text-xl">${t.noTickets}</div>`; return; }
            supportList.innerHTML = '';
            allTickets.forEach(ticket => {
                const date = new Date(ticket.timestamp).toLocaleString();
                const div = document.createElement('div');
                div.className = "glass p-6 card-hover";
                div.innerHTML = `<div class="flex justify-between items-start mb-4"><div><h3 class="text-xl font-bold">${t.ticketTitle}</h3><p class="text-slate-400 text-sm">${t.ticketUser}: ${ticket.email} (${ticket.mc_name || 'Unknown'})</p><p class="text-slate-500 text-xs">${t.ticketDate}: ${date}</p></div><button onclick="deleteTicket('${ticket.id}')" class="p-2 text-red-400 hover:bg-red-400/10 rounded-lg transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button></div><div class="bg-white/5 p-4 rounded-xl border border-white/5 text-slate-300 whitespace-pre-wrap">${ticket.message}</div>`;
                supportList.appendChild(div);
            });
        }

        window.downloadConfig = (id) => {
            const config = allConfigs.find(c => c.id === id);
            if (!config || !config.data) return alert("데이터를 찾을 수 없습니다.");
            try {
                // 관리자 페이지 다운로드: 플레이어가 업로드한 원본 형식 그대로 다운로드
                const author = config.original_f34_author || config.author || "Unknown";
                const fileContent = 
`F34 - ${author}
Title: ${config.name || "Untitled"}
Description: ${config.description || ""}
Category: ${config.category || "General"}
MC Version: ${config.mc_version || "--"}
F34 Version: ${config.f34_version || "--"}
Active Mods: ${config.active_mods || "--"}
---DATA---
${config.data}`;

                const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${config.name || 'config'}.f34`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) { 
                console.error("Download Error:", e);
                alert("다운로드 실패: " + e.message); 
            }
        };

        const langFlags = {
            'en': 'https://flagcdn.com/20x15/us.png',
            'jp': 'https://flagcdn.com/20x15/jp.png',
            'cn': 'https://flagcdn.com/20x15/cn.png',
            'ko': 'https://flagcdn.com/20x15/kr.png',
            'tw': 'https://flagcdn.com/20x15/tw.png',
            'fr': 'https://flagcdn.com/20x15/fr.png',
            'de': 'https://flagcdn.com/20x15/de.png',
            'es': 'https://flagcdn.com/20x15/es.png',
            'ru': 'https://flagcdn.com/20x15/ru.png',
            'vn': 'https://flagcdn.com/20x15/vn.png',
            'th': 'https://flagcdn.com/20x15/th.png'
        };

        const normalizeCategoryAlias = (cat) => {
            const map = {
                'graphics': 'Graphic',
                'optimization': 'Optimize',
                'utility': 'Utility',
                'translation': 'Translate',
                'content': 'Content',
                'shader': 'Shader',
                'resource': 'Resource',
                'other': 'Other'
            };
            return map[cat] || cat;
        };

        window.deleteTicket = async (id) => { if (!confirm("Delete ticket?")) return; try { await deleteDoc(doc(db, "support_tickets", id)); alert("Deleted."); fetchTickets(); } catch (e) { alert("Failed."); } };
        
        window.deleteApprovedConfig = async (id) => {
            if (!confirm("이 정식 승인된 설정을 완전히 삭제하시겠습니까?")) return;
            try {
                await deleteDoc(doc(db, "shared_configs", id));
                alert("삭제되었습니다.");
                fetchApprovedConfigs();
            } catch (e) {
                alert("삭제 실패: " + e.message);
            }
        };

        window.updateStatus = async (id, status) => {
            if (!confirm(status === 'approved' ? "이 설정을 정식 승인하시겠습니까?" : "이 설정을 거절하고 영구 삭제하시겠습니까?")) return;
            try {
                const docRef = doc(db, "shared_configs", id);
                if (status === 'approved') {
                    await updateDoc(docRef, { status: 'approved' });
                    alert("승인되었습니다.");
                } else {
                    await deleteDoc(docRef);
                    alert("거절 및 삭제되었습니다.");
                }
                closePlayerModal();
                // setupDataFetching은 current scope에서 정의되어 있거나, 
                // 전역에서 호출 가능해야 합니다. window.setupDataFetching으로 선언하거나 직접 호출합니다.
                if (typeof setupDataFetching !== 'undefined') {
                    setupDataFetching();
                } else {
                    location.reload(); // 함수를 찾을 수 없는 경우 안전하게 새로고침
                }
            } catch (e) { 
                console.error("Update Status Error:", e);
                alert("권한이 없거나 오류가 발생했습니다: " + e.message); 
            }
        };

        try {
            const app = initializeApp(firebaseConfig);
            auth = initializeAuth(app, {
                persistence: browserLocalPersistence
            });
            db = initializeFirestore(app, { experimentalForceLongPolling: true });

            const loginScreen = document.getElementById('login-screen');
            const adminPanel = document.getElementById('admin-panel');
            const authBtn = document.getElementById('auth-btn');

            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const nickname = user.email.split('@')[0];
                    const isAuthorized = ADMIN_WHITELIST_UIDS.includes(user.uid) || ADMIN_WHITELIST_NICKNAMES.includes(nickname);

                    if (isAuthorized) {
                        currentUser = user;
                        currentLang = 'ko'; // Set admin to Korean always
                        updateUI();
                        if (loginScreen) loginScreen.classList.add('hidden');
                        if (adminPanel) adminPanel.classList.remove('hidden');
                        try {
                            const userDoc = await getDoc(doc(db, "users", user.email));
                            if (userDoc.exists()) {
                                mcAccount = userDoc.data();
                                if (authBtn) {
                                    authBtn.classList.remove('px-6');
                                    authBtn.classList.add('px-4');
                                    authBtn.innerHTML = `<div class="flex items-center gap-3"><img src="https://render.crafty.gg/3d/bust/${mcAccount.mc_name}" class="w-8 h-8 rounded border border-white/20"><div class="text-left"><div class="text-[10px] opacity-50">Admin</div><div class="font-bold text-xs">${mcAccount.mc_name}</div></div></div>`;
                                }
                            } else {
                                if (authBtn) authBtn.textContent = "Admin (" + nickname + ")";
                            }
                        } catch (e) { log("Auth Doc Error: " + e.message); }
                        setupDataFetching();
                        fetchReports();
                        fetchTickets();
                        fetchPlayers();
                        fetchApprovedConfigs(); // 추가
                    } else {
                        alert("Access Denied: Not an authorized admin (" + nickname + ")");
                        signOut(auth);
                    }
                } else {
                    if (loginScreen) loginScreen.classList.remove('hidden');
                    if (adminPanel) adminPanel.classList.add('hidden');
                }
                updateUI();
            });

            const doLoginBtn = document.getElementById('do-login-btn');
            if (doLoginBtn) {
                doLoginBtn.onclick = async () => {
                    const nick = document.getElementById('login-nickname').value.trim();
                    const pass = document.getElementById('login-password').value;
                    const errorEl = document.getElementById('login-error');
                    
                    if (!nick || !pass) {
                        errorEl.textContent = "Please enter nickname and password.";
                        errorEl.classList.remove('hidden');
                        return;
                    }

                    errorEl.classList.add('hidden');
                    try {
                        const email = `${nick}@f34-di.com`;
                        await signInWithEmailAndPassword(auth, email, pass);
                    } catch (e) {
                        errorEl.textContent = "Login failed: " + e.message;
                        errorEl.classList.remove('hidden');
                    }
                };
            }

            if (authBtn) authBtn.onclick = () => { if (confirm("Logout?")) signOut(auth); };

            function setupDataFetching() {
                const q = query(collection(db, "shared_configs"), where("status", "==", "pending"));
                onSnapshot(q, (snap) => {
                    if (fetchTimeout) clearTimeout(fetchTimeout);
                    allConfigs = [];
                    snap.forEach(doc => {
                        const d = doc.data();
                        allConfigs.push({
                            id: doc.id,
                            ...d,
                            data: d.config_json || d.data
                        });
                    });
                    dataLoaded = true;
                    renderConfigs();
                }, (err) => {
                    log("SDK Error: " + err.message);
                    if (!dataLoaded) fetchConfigsREST();
                });
                fetchTimeout = setTimeout(() => { if (!dataLoaded) fetchConfigsREST(); }, 5000);
            }

            updateUI();
        } catch (e) { log("Init Error: " + e.message); }
    </script>
</body>

</html>
