<style>
    .nav-link {
        color: rgba(148, 163, 184, 0.8);
        position: relative;
    }
    .nav-link::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 0;
        height: 2px;
        background: #3b82f6;
        transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .nav-link:hover::after, .nav-link.active::after {
        width: 100%;
    }
    .nav-link.active {
        color: white;
    }
</style>

<script>
    function updateActiveNav() {
        const path = window.location.pathname;
        const page = path.split("/").pop() || "index.html";
        document.querySelectorAll('.nav-link').forEach(link => {
            if (link.getAttribute('href') === page) {
                link.classList.add('active');
            } else {
                link.classList.remove('active');
            }
        });
    }
    
    // Flag update
    function updateFlag(lang) {
        const flags = { en: '🇺🇸', ko: '🇰🇷', ja: '🇯🇵', zh: '🇨🇳' };
        const flagEl = document.getElementById('current-lang-flag');
        if (flagEl) flagEl.textContent = flags[lang] || '🇺🇸';
    }

    // Wrap the existing changeLang if it exists
    const originalChangeLang = window.changeLang;
    window.changeLang = (lang) => {
        updateFlag(lang);
        if (typeof originalChangeLang === 'function') {
            originalChangeLang(lang);
        } else {
            localStorage.setItem('lang', lang);
            location.reload(); // Simple fallback
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        updateActiveNav();
        updateFlag(localStorage.getItem('lang') || 'en');
    });
</script>
